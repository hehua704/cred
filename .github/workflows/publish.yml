name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 上传 Release 资产（备用分发）
  id-token: write   # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: npm >= 11.5.1 (OIDC support)
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm test
      - run: npm run check:leak

      - name: pack tarball
        run: npm pack

      # 主方案：发布到 npm。
      # 需先在 npmjs.com 配好 Trusted Publisher，再把仓库变量 NPM_PUBLISH 设为 true。
      - name: npm publish (primary)
        if: vars.NPM_PUBLISH == 'true'
        run: npm publish --provenance --access public

      # 备用方案：把 tarball 挂到 Release，供无法访问 npm 的环境安装。
      - name: attach tarball to release (fallback)
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
