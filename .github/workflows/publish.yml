name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 上传 Release 资产（备用分发）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm test
      - run: npm run check:leak

      - name: pack tarball
        run: npm pack

      # 主方案：发布到 npm（token 方式）
      # 需要仓库 secret NPM_TOKEN，以及变量 NPM_PUBLISH=true
      - name: npm publish (primary)
        if: vars.NPM_PUBLISH == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 备用方案：把 tarball 挂到 Release
      - name: attach tarball to release (fallback)
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
